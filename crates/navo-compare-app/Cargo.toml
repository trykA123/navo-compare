# The Sidewise desktop app: window shell, start screen, sessions and command line.
[package]
name = "navo-compare-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sidewise"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gpui-kit = "=0.9.1"
image = { version = "=0.25.10", default-features = false }
navo-compare-cli = { path = "../navo-compare-cli" }
navo-compare-profile = { path = "../navo-compare-profile" }
navo-ui = { git = "https://github.com/trykA123/navo", rev = "4900194ca5cdabf358020319f79172e941491cb5" }
resvg = "=0.49.0"

[build-dependencies]
embed-resource = "3.0.12"
navo-compare-profile = { path = "../navo-compare-profile" }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
