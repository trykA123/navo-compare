# The Sidewise desktop app: window shell, start screen, sessions and command line.
[package]
name = "navo-compare-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sidewise"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gpui-kit = "=0.9.1"
navo-compare-cli = { path = "../navo-compare-cli" }
navo-compare-profile = { path = "../navo-compare-profile" }
navo-ui = { git = "https://github.com/trykA123/navo", rev = "14a57fd611670233aee055148a4a87d2ba8cc518" }

[build-dependencies]
embed-resource = "3.0.12"
navo-compare-profile = { path = "../navo-compare-profile" }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
