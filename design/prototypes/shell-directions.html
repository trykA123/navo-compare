<title>Navo Compare Shell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: a picker bar (direction, screen), one app window drawn to scale, notes under it.
   Every colour is a token; a direction changes hues and fonts only, never literals. */
:root, .win {
  --rail: oklch(95.5% 0.012 var(--h)); --bg: oklch(98.5% 0.008 var(--h)); --surface: oklch(99.8% 0.003 var(--h));
  --line: oklch(89% 0.014 var(--h)); --text: oklch(22% 0.014 var(--h)); --muted: oklch(48.8% 0.017 var(--h));
  --faint: oklch(62% 0.017 var(--h)); --hover: oklch(94.25% 0.027 var(--ha)); --sel: oklch(90% 0.046 var(--ha));
  --accent: oklch(52% 0.1 var(--ha)); --on-accent: oklch(99% 0.005 var(--ha));
  --only-l: oklch(50% 0.16 var(--hl)); --only-l-bg: oklch(95% 0.032 var(--hl)); --only-l-word: oklch(88% 0.07 var(--hl));
  --only-r: oklch(45% 0.12 var(--hr)); --only-r-bg: oklch(95% 0.04 var(--hr)); --only-r-word: oklch(87% 0.08 var(--hr));
  --chg: oklch(48% 0.11 70); --folder: oklch(49.6% 0.102 80); --ok: oklch(48% 0.108 160);
  --shadow: 0 18px 44px -14px oklch(21% 0.012 260 / 0.28), 0 0 0 1px var(--line);
}
:root { --h: 225; --ha: 218; --hl: 27; --hr: 150;
  --font-ui: "Inter", "Segoe UI Variable", "Segoe UI", sans-serif; --font-mono: "JetBrains Mono", ui-monospace, monospace; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]), :root:not([data-theme="light"]) .win {
    --rail: oklch(19% 0.014 var(--h)); --bg: oklch(22.5% 0.014 var(--h)); --surface: oklch(26.5% 0.014 var(--h));
    --line: oklch(33% 0.014 var(--h)); --text: oklch(93.8% 0.014 var(--h)); --muted: oklch(72% 0.017 var(--h));
    --faint: oklch(58% 0.017 var(--h)); --hover: oklch(27.75% 0.036 var(--ha)); --sel: oklch(33% 0.058 var(--ha));
    --accent: oklch(76% 0.11 var(--ha)); --on-accent: oklch(18% 0.03 var(--ha));
    --only-l: oklch(78% 0.13 var(--hl)); --only-l-bg: oklch(27% 0.05 var(--hl)); --only-l-word: oklch(38% 0.09 var(--hl));
    --only-r: oklch(82% 0.13 var(--hr)); --only-r-bg: oklch(27% 0.05 var(--hr)); --only-r-word: oklch(38% 0.08 var(--hr));
    --chg: oklch(82% 0.12 70); --folder: oklch(82% 0.13 80); --ok: oklch(85% 0.13 160);
    --shadow: 0 18px 44px -14px oklch(0% 0 0 / 0.6), 0 0 0 1px var(--line);
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
}
:root[data-theme="dark"], :root[data-theme="dark"] .win {
  --rail: oklch(19% 0.014 var(--h)); --bg: oklch(22.5% 0.014 var(--h)); --surface: oklch(26.5% 0.014 var(--h));
  --line: oklch(33% 0.014 var(--h)); --text: oklch(93.8% 0.014 var(--h)); --muted: oklch(72% 0.017 var(--h));
  --faint: oklch(58% 0.017 var(--h)); --hover: oklch(27.75% 0.036 var(--ha)); --sel: oklch(33% 0.058 var(--ha));
  --accent: oklch(76% 0.11 var(--ha)); --on-accent: oklch(18% 0.03 var(--ha));
  --only-l: oklch(78% 0.13 var(--hl)); --only-l-bg: oklch(27% 0.05 var(--hl)); --only-l-word: oklch(38% 0.09 var(--hl));
  --only-r: oklch(82% 0.13 var(--hr)); --only-r-bg: oklch(27% 0.05 var(--hr)); --only-r-word: oklch(38% 0.08 var(--hr));
  --chg: oklch(82% 0.12 70); --folder: oklch(82% 0.13 80); --ok: oklch(85% 0.13 160);
  --shadow: 0 18px 44px -14px oklch(0% 0 0 / 0.6), 0 0 0 1px var(--line);
}
:root[data-theme="dark"] { color-scheme: dark; }
/* Directions: hues and fonts only. */
.win[data-dir="c"] { --h: 300; --ha: 330; --font-ui: "Geist", "Segoe UI", sans-serif; }
.win[data-dir="d"] { --h: 150; --ha: 150; --hl: 275; --hr: 60; --font-ui: "Hanken Grotesk", "Segoe UI", sans-serif; }

* { box-sizing: border-box; }
body { background: var(--rail); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1180px; margin-inline: auto; display: grid; gap: 14px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 2px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); font-weight: 500; }
.seg button:focus-visible, .win button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* The app window */
.win { min-width: 900px; height: 610px; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 13px;
  border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.win button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }

.title { height: 36px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: var(--rail); border-bottom: 1px solid var(--line); }
.logo { width: 18px; height: 18px; border-radius: 5px; background: var(--text); margin-right: 8px; position: relative; flex: none; }
.logo::after { content: ""; position: absolute; inset: 4px 8px; background: var(--rail); }
.tab { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.tab.on { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chg); flex: none; }
.dot.ok { background: var(--ok); }
.grow { flex: 1; min-width: 0; }

.status { height: 26px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; background: var(--rail); }
.body { flex: 1; min-height: 0; display: flex; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.pill .k { color: var(--faint); font-size: 11px; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.chip.on { color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.swap { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.head { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.crumb { color: var(--muted); } .crumb b { color: var(--text); font-weight: 500; }
.mseg { display: inline-flex; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.mseg span { padding: 3px 9px; font-size: 12px; color: var(--muted); }
.mseg span.on { background: var(--sel); color: var(--text); }
.primary { height: 30px; padding: 0 16px !important; border-radius: 7px; background: var(--accent) !important; color: var(--on-accent) !important; font-weight: 500; }
.field { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.field.focus { box-shadow: inset 0 0 0 2px var(--accent); }
.field .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caret { width: 1px; height: 16px; background: var(--accent); }
.sect { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); padding: 10px 0 4px; }
.rec { display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr) 150px 70px; gap: 8px; align-items: center; height: 30px; padding: 0 8px; border-radius: 6px; }
.rec.on { background: var(--sel); }
.rec span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* tree */
.tree { flex: 1; min-height: 0; overflow: hidden; }
.tr { display: grid; grid-template-columns: minmax(0, 1fr) 70px 96px 120px minmax(0, 1fr) 70px 96px; align-items: center; height: 26px; padding: 0 12px; gap: 8px; }
.tr.hd { height: 24px; color: var(--faint); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
.tr.on { background: var(--sel); }
.tr .n { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tr .n i { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: normal; }
.tr .r { text-align: right; color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--faint); flex: none; }
.st.diff { color: var(--chg); } .st.diff::before { background: var(--chg); }
.st.l { color: var(--only-l); } .st.l::before { background: var(--only-l); }
.st.r { color: var(--only-r); } .st.r::before { background: var(--only-r); }
.st.same { color: var(--faint); }
.gap { height: 14px; border-radius: 3px; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--line) 4px 5px); opacity: 0.7; }
.fold { width: 14px; height: 11px; border-radius: 2px; background: var(--folder); flex: none; opacity: 0.85; }
.file { width: 11px; height: 13px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--faint); flex: none; margin-inline: 1.5px; }
.tw { width: 10px; color: var(--faint); font-size: 10px; flex: none; }
.prog { height: 4px; width: 46px; border-radius: 2px; background: var(--line); overflow: hidden; display: inline-block; }
.prog b { display: block; height: 100%; width: 62%; background: var(--accent); }
/* diff */
.diff { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.side { flex: 1; min-width: 0; }
.side + .side { border-left: 1px solid var(--line); }
.ln { display: grid; grid-template-columns: 40px minmax(0, 1fr); height: 21px; align-items: center; font-family: var(--font-mono); font-size: 12px; }
.ln .no { text-align: right; padding-right: 10px; color: var(--faint); }
.ln .tx { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.ln.del { background: var(--only-l-bg); } .ln.add { background: var(--only-r-bg); }
.ln.del .no { color: var(--only-l); } .ln.add .no { color: var(--only-r); }
.ln.fill { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); opacity: 0.45; }
.ln.skip { color: var(--faint); background: var(--rail); font-family: var(--font-ui); }
.w-del { background: var(--only-l-word); border-radius: 2px; } .w-add { background: var(--only-r-word); border-radius: 2px; }
.map { width: 14px; flex: none; border-left: 1px solid var(--line); position: relative; background: var(--rail); }
.map b { position: absolute; left: 3px; right: 3px; height: 5px; border-radius: 1px; }
.map .vp { position: absolute; left: 0; right: 0; top: 30%; height: 22%; background: var(--hover); box-shadow: inset 0 0 0 1px var(--line); }
/* B rail */
.railb { width: 214px; flex: none; background: var(--rail); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.ri { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--muted); min-width: 0; }
.ri span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri.on { background: var(--sel); color: var(--text); }
.strip { flex: none; border-top: 1px solid var(--line); background: var(--surface); }
.strip .cap { display: flex; gap: 10px; align-items: center; padding: 6px 12px; color: var(--muted); font-size: 12px; }
/* C bar */
.cbar { margin: 10px auto 0; width: min(760px, 94%); display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); flex: none; }
.cbar .tok { display: inline-flex; align-items: center; height: 26px; padding: 0 8px; border-radius: 6px; background: var(--hover); font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.sugg { margin: 6px auto 0; width: min(760px, 94%); background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; }
.sg { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 6px; }
.sg.on { background: var(--sel); }
.sg .t { width: 62px; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.ctr { display: grid; grid-template-columns: minmax(0, 1fr) 16px 16px 110px; gap: 8px; align-items: center; height: 25px; padding: 0 10px; }
.ctr.on { background: var(--sel); }
.sq { width: 9px; height: 9px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--line); }
.sq.l { background: var(--only-l); box-shadow: none; } .sq.r { background: var(--only-r); box-shadow: none; } .sq.c { background: var(--chg); box-shadow: none; } .sq.s { background: var(--faint); box-shadow: none; opacity: 0.5; }
/* D sides */
.half { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 44px; }
.half.l { background: var(--only-l-bg); } .half.r { background: var(--only-r-bg); }
.half h3 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.half.l h3, .tagl { color: var(--only-l); } .half.r h3, .tagr { color: var(--only-r); }
.seam { width: 0; position: relative; flex: none; }
.seam div { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: grid; gap: 8px; justify-items: center; }
.round { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.edge-l { box-shadow: inset 3px 0 0 var(--only-l); } .edge-r { box-shadow: inset 3px 0 0 var(--only-r); }
.card { margin: 10px 14px 0; border-radius: 8px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.card .ch { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-bottom: 1px solid var(--line); }
.bars { display: inline-flex; gap: 2px; } .bars b { width: 14px; height: 6px; border-radius: 1px; background: var(--line); }
.bars b.l { background: var(--only-l); } .bars b.r { background: var(--only-r); }
@media (prefers-reduced-motion: no-preference) { .win { transition: opacity 80ms; } }
</style>

<div class="page">
  <h1>Navo Compare: patru direcții pentru aplicația standalone</h1>
  <p class="lede">Alege o direcție și un ecran. Datele sunt aceleași peste tot: compararea <span class="mono">navo@v0.6.0</span> cu <span class="mono">navo@main</span>. Poți combina: de exemplu ecranul de start dintr-o direcție și arborele din alta.</p>
  <div class="bar">
    <div><span class="lab">Direcție</span><span class="seg" id="dirs"></span></div>
    <div><span class="lab">Ecran</span><span class="seg" id="screens"></span></div>
  </div>
  <div class="stage"><div class="win" id="win" data-dir="a"></div></div>
  <ul class="notes" id="notes"></ul>
</div>

<script>
// Renders four shell directions for Navo Compare from one sample data set; no state is stored.
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const L = "C:\\src\\navo@v0.6.0", R = "C:\\src\\navo@main";

// Tree rows: depth, name, folder?, left [size, time], right [size, time], status class, status text.
const ROWS = [
  [0, "crates", 1, ["", ""], ["", ""], "diff", "5 differences"],
  [1, "navo-compare/src", 1, ["", ""], ["", ""], "diff", "3 differences"],
  [2, "text/card.rs", 0, ["12.4 KB", "10 Nov 21:14"], ["13.1 KB", "11 Nov 09:02"], "diff", "Different +18 −4"],
  [2, "text/pair.rs", 0, ["6.0 KB", "02 Nov 10:40"], ["6.0 KB", "02 Nov 10:40"], "same", "Same"],
  [2, "image.rs", 0, null, ["8.2 KB", "10 Nov 23:51"], "r", "Only right"],
  [2, "bytes/legacy.rs", 0, ["3.1 KB", "28 Oct 16:05"], null, "l", "Only left"],
  [1, "navo-app/src/compare/diff/stream.rs", 0, ["21.7 KB", "09 Nov 23:50"], ["23.0 KB", "11 Nov 02:10"], "diff", "Different +41 −12"],
  [0, "docs/roadmap.md", 0, ["9.8 KB", "08 Nov 12:00"], ["10.1 KB", "10 Nov 08:30"], "diff", "Different +6 −2"],
  [0, "assets/logo.png", 0, ["48 KB", "14 Oct 09:12"], ["51 KB", "05 Nov 18:44"], "diff", "Different (binary)"],
  [0, "Cargo.lock", 0, ["212 KB", "10 Nov 07:09"], ["212 KB", "10 Nov 07:09"], "same", "Same after rules"],
  [0, "trace-2026-11-10.log", 0, ["1.2 GB", "10 Nov 06:00"], ["1.2 GB", "10 Nov 06:00"], "chk", "Checking"],
];
// Diff rows: kind, left number, left text, right number, right text. "w" marks the changed words.
const DIFF = [
  ["eq", 41, "pub fn card(alignment: &Alignment, limits: CardLimits) -> CardPlan {", 41],
  ["eq", 42, "    let mut rows = Vec::new();", 42],
  ["chg", 43, ["    let context = ", "3", ";"], 43, ["    let context = ", "limits.context_lines", ";"]],
  ["eq", 44, "    for hunk in alignment.hunks() {", 44],
  ["chg", 45, ["        ", "rows.push(Row::gap(hunk.before()));", ""], 45, ["        ", "if hunk.before() > context {", ""]],
  ["add", null, null, 46, "            rows.push(Row::unchanged(hunk.before() - context));"],
  ["add", null, null, 47, "        }"],
  ["eq", 46, "        rows.extend(hunk.rows(context));", 48],
  ["eq", 47, "    }", 49],
  ["fold", null, "38 unchanged lines"],
  ["chg", 86, ["    ", "CardPlan { rows, truncated: false }", ""], 88, ["    ", "CardPlan::new(rows, limits.max_rows)", ""]],
  ["eq", 87, "}", 89],
];
const RECENT = [
  [L, R, "Git refs · 9 differences", "now"],
  ["D:\\builds\\ecu-4.2", "D:\\builds\\ecu-4.3", "Folders · 214 differences", "yesterday"],
  ["C:\\cfg\\prod.yaml", "C:\\cfg\\stage.yaml", "Files · 12 changes", "Mon"],
  ["Clipboard text", "Clipboard text", "Text · 3 changes", "Mon"],
];

const titlebar = (tabs) => `<div class="title"><span class="logo"></span>${tabs}<span class="grow"></span><span class="wctl"><span>–</span><span>□</span><span>×</span></span></div>`;
const tab = (name, on, dot) => `<span class="tab${on ? " on" : ""}">${dot ? `<span class="dot ${dot}"></span>` : ""}${name}</span>`;
const TABS = tab("navo · v0.6.0 ↔ main", true, "") + tab("ecu-4.2 ↔ ecu-4.3", false, "") + `<span class="tab faint">+</span>`;
const status = (...parts) => `<div class="status">${parts.map((p) => `<span>${p}</span>`).join("")}</div>`;
const word = (parts, cls) => `${esc(parts[0])}<span class="${cls}">${esc(parts[1])}</span>${esc(parts[2])}`;

/** One recent row: left, arrow, right, kind and age. */
const recents = (on) => RECENT.map((r, i) => `<div class="rec${i === on ? " on" : ""}"><span class="mono">${esc(r[0])}</span><span class="faint">↔</span><span class="mono">${esc(r[1])}</span><span class="muted">${r[2]}</span><span class="faint" style="text-align:right">${r[3]}</span></div>`).join("");

/** The aligned tree: left columns, a status gutter, right columns. */
function tree(sel) {
  const cell = (side, d, name, folder) => side
    ? `<span class="n" style="padding-left:${d * 16}px"><span class="tw">${folder ? "▾" : ""}</span><span class="${folder ? "fold" : "file"}"></span><i>${name}</i></span><span class="r num">${side[0]}</span><span class="r num">${side[1]}</span>`
    : `<span class="gap" style="margin-left:${d * 16 + 16}px"></span><span></span><span></span>`;
  const st = (c, t) => c === "chk" ? `<span class="st">${t} <span class="prog"><b></b></span> 62 %</span>` : `<span class="st ${c}">${t}</span>`;
  return `<div class="tree"><div class="tr hd"><span>Left</span><span class="r">Size</span><span class="r">Modified</span><span></span><span>Right</span><span class="r">Size</span><span class="r">Modified</span></div>` +
    ROWS.map((r, i) => `<div class="tr${i === sel ? " on" : ""}">${cell(r[3], r[0], r[1], r[2])}${st(r[5], r[6])}${cell(r[4], r[0], r[1], r[2])}</div>`).join("") + `</div>`;
}

/** Side-by-side diff lines for one side ("l" or "r"). */
function sideLines(which) {
  return DIFF.map((d) => {
    const [k, ln, lt, rn, rt] = d;
    if (k === "fold") return `<div class="ln skip"><span class="no"></span><span class="tx">${which === "l" ? "⋯ " + lt : ""}</span></div>`;
    if (k === "eq") return `<div class="ln"><span class="no">${which === "l" ? ln : rn}</span><span class="tx">${esc(lt)}</span></div>`;
    if (k === "add") return which === "l" ? `<div class="ln fill"></div>` : `<div class="ln add"><span class="no">${rn}</span><span class="tx">${esc(rt)}</span></div>`;
    return which === "l"
      ? `<div class="ln del"><span class="no">${ln}</span><span class="tx">${word(lt, "w-del")}</span></div>`
      : `<div class="ln add"><span class="no">${rn}</span><span class="tx">${word(rt, "w-add")}</span></div>`;
  }).join("");
}
/** Unified diff lines, optionally cut to `max` rows. */
function unified(max) {
  const out = [];
  for (const [k, ln, lt, rn, rt] of DIFF) {
    if (k === "fold") out.push(`<div class="ln skip"><span class="no"></span><span class="tx">⋯ ${lt}</span></div>`);
    else if (k === "eq") out.push(`<div class="ln"><span class="no">${rn}</span><span class="tx">  ${esc(lt)}</span></div>`);
    else if (k === "add") out.push(`<div class="ln add"><span class="no">${rn}</span><span class="tx">+ ${esc(rt)}</span></div>`);
    else out.push(`<div class="ln del"><span class="no">${ln}</span><span class="tx">- ${word(lt, "w-del")}</span></div>`, `<div class="ln add"><span class="no">${rn}</span><span class="tx">+ ${word(rt, "w-add")}</span></div>`);
  }
  return out.slice(0, max || 99).join("");
}
const map = `<div class="map"><span class="vp"></span><b style="top:12%;background:var(--chg)"></b><b style="top:17%;background:var(--only-r)"></b><b style="top:58%;background:var(--chg)"></b><b style="top:83%;background:var(--only-l)"></b></div>`;
const sbs = (extraL = "", extraR = "") => `<div class="diff"><div class="side ${extraL}">${sideLines("l")}</div><div class="side ${extraR}">${sideLines("r")}</div>${map}</div>`;
const pills = `<span class="pill"><span class="k">L</span><span class="mono">navo@v0.6.0</span></span><span class="swap">⇄</span><span class="pill"><span class="k">R</span><span class="mono">navo@main</span></span>`;
const rules = `<span class="chip on">Ignore whitespace</span><span class="chip">Line endings</span><span class="chip">Case</span>`;
const filter = `<span class="mseg"><span>All 11</span><span class="on">Differences 7</span><span>Orphans 2</span><span>Same 2</span></span>`;
const fieldsRow = `<div style="display:flex;gap:8px;align-items:center"><div class="field focus grow"><span class="faint">Left</span><span class="v mono">${esc(L)}</span><span class="chip">Git ref</span></div><span class="swap">⇄</span><div class="field grow"><span class="faint">Right</span><span class="v mono">${esc(R)}</span><span class="caret"></span><span class="chip">Git ref</span></div><button class="primary">Compare</button></div>`;

const VIEWS = {
  a: {
    start: () => titlebar(tab("New compare", true)) + `<div class="body"><div class="col" style="padding:70px 110px 0;gap:6px">${fieldsRow}
      <div class="faint" style="font-size:12px;padding:4px 2px">Type or paste a path, drop a file or folder, or write <span class="mono">repo@branch</span>. <kbd>Tab</kbd> next side · <kbd>Enter</kbd> compare · <kbd>Ctrl+Shift+V</kbd> compare two texts</div>
      <div class="sect">Recent</div>${recents(0)}<div class="sect">Named</div>
      <div class="rec"><span>Release check</span><span></span><span class="mono muted">navo@last-tag ↔ navo@main</span><span class="muted">Git refs</span><span></span></div>
      <div class="rec"><span>ECU nightly</span><span></span><span class="mono muted">D:\\builds\\prev ↔ D:\\builds\\latest</span><span class="muted">Folders</span><span></span></div></div></div>` +
      status("<kbd>Ctrl+K</kbd> commands", "<kbd>F1</kbd> keys"),
    folders: () => titlebar(TABS) + `<div class="body"><div class="col"><div class="head">${pills}<span class="crumb">› <b>Folders</b></span><span class="grow"></span>${rules}${filter}</div>${tree(2)}</div></div>` +
      status("7 differences · 2 orphans · 2 same", "Checking 1 file · 62 %", "<kbd>Enter</kbd> open · <kbd>Alt+F</kbd> Stream · <kbd>Ctrl+Alt+→</kbd> copy right"),
    diff: () => titlebar(TABS) + `<div class="body"><div class="col"><div class="head">${pills}<span class="crumb">› Folders › Stream › <b>crates/navo-compare/src/text/card.rs</b></span><span class="grow"></span>${rules}<span class="mseg"><span class="on">Side by side</span><span>Unified</span></span></div>${sbs()}</div></div>` +
      status("Change 2 of 4 · file 1 of 7", "UTF-8 · LF", "<kbd>Alt+↓</kbd> next change · <kbd>Ctrl+Alt+↓</kbd> next file · <kbd>Esc</kbd> back"),
  },
  b: {
    start: () => titlebar("") + `<div class="body">${railB(-1)}<div class="col" style="padding:54px 70px 0;gap:10px">
      <div style="font-size:18px;font-weight:600">New compare</div>
      <div class="field focus"><span class="faint" style="width:40px">Left</span><span class="v mono">${esc(L)}</span><span class="chip">Git ref</span></div>
      <div class="field"><span class="faint" style="width:40px">Right</span><span class="v mono">${esc(R)}</span><span class="caret"></span><span class="chip">Git ref</span></div>
      <div style="display:flex;gap:10px;align-items:center"><button class="primary">Compare</button><span class="chip">⇄ Swap sides</span><span class="chip">Compare two texts</span><span class="grow"></span><span class="faint" style="font-size:12px">Drop files or folders anywhere</span></div>
      <div class="sect">Rules for this compare</div><div style="display:flex;gap:6px;flex-wrap:wrap">${rules}<span class="chip on">Respect .gitignore</span><span class="chip">Ignore lines matching…</span></div></div></div>` +
      status("<kbd>Ctrl+K</kbd> commands", "<kbd>F1</kbd> keys"),
    folders: () => titlebar("") + `<div class="body">${railB(0)}<div class="col"><div class="head">${pills}<span class="grow"></span>${filter}</div>${tree(2)}
      <div class="strip"><div class="cap"><b style="color:var(--text);font-weight:500">card.rs</b><span>first change of 4</span><span class="grow"></span><kbd>Space</kbd> preview · <kbd>Enter</kbd> open</div>${unified(4)}</div></div></div>` +
      status("7 differences · 2 orphans · 2 same", "Checking 1 file · 62 %"),
    diff: () => titlebar("") + `<div class="body">${railB(0, true)}<div class="col"><div class="head"><span class="crumb"><b>card.rs</b> <span class="faint">crates/navo-compare/src/text</span></span><span class="grow"></span>${rules}<span class="mseg"><span class="on">Side by side</span><span>Unified</span></span></div>${sbs()}</div></div>` +
      status("Change 2 of 4 · file 1 of 7", "UTF-8 · LF", "<kbd>Esc</kbd> back to folders"),
  },
  c: {
    start: () => titlebar("") + `<div class="body"><div class="col">${cbar(`<span class="tok">${esc(L)}</span><span class="faint">⇄</span><span class="mono">C:\\src\\navo@ma</span><span class="caret"></span>`)}
      <div class="sugg"><div class="sg on"><span class="t">Branch</span><span class="mono">navo@main</span><span class="grow"></span><span class="faint">14 commits ahead of v0.6.0</span></div>
      <div class="sg"><span class="t">Branch</span><span class="mono">navo@main-installer</span></div>
      <div class="sg"><span class="t">Recent</span><span class="mono">D:\\builds\\ecu-4.3</span></div>
      <div class="sg"><span class="t">Folder</span><span class="mono">C:\\src\\navo</span><span class="grow"></span><span class="faint">working tree</span></div>
      <div class="sg"><span class="t">Text</span><span>Clipboard: 42 lines copied 2 min ago</span></div></div>
      <div class="grow"></div><div class="faint" style="text-align:center;padding-bottom:26px;font-size:12px">The bar is the whole start screen. <kbd>Tab</kbd> accepts a side · <kbd>Enter</kbd> compares · <kbd>↑</kbd> recent pairs</div></div></div>`,
    folders: () => titlebar("") + `<div class="body"><div class="col">${cbar(`<span class="tok">navo@v0.6.0</span><span class="faint">⇄</span><span class="tok">navo@main</span><span class="grow"></span><span class="faint mono">7 diff · 2 orphan</span><kbd>Ctrl+K</kbd>`)}
      <div class="body" style="margin-top:10px;border-top:1px solid var(--line)"><div style="width:44%;border-right:1px solid var(--line);padding-top:6px;overflow:hidden">${ctree(2)}</div>
      <div class="col"><div class="head"><span class="mono">text/card.rs</span><span class="st diff">+18 −4</span><span class="grow"></span><span class="faint" style="font-size:12px">preview · <kbd>Enter</kbd> full window</span></div><div style="overflow:hidden">${unified()}</div></div></div></div></div>` +
      status("L R columns show where a file exists", "Checking 1 file · 62 %"),
    diff: () => titlebar("") + `<div class="body"><div class="col">${cbar(`<span class="tok">card.rs</span><span class="faint mono">1 / 7</span><span class="grow"></span><span class="mono faint">change 2 / 4</span><kbd>J</kbd><kbd>K</kbd><kbd>Esc</kbd>`)}
      <div style="margin-top:10px;border-top:1px solid var(--line);flex:1;min-height:0;display:flex"><div class="grow" style="overflow:hidden">${unified()}</div>${map}</div></div></div>`,
  },
  d: {
    start: () => titlebar(tab("New compare", true)) + `<div class="body"><div class="half l"><h3>Left</h3><div class="field focus"><span class="v mono">${esc(L)}</span><span class="chip">Git ref</span></div><div class="muted">Drop a file or folder on this half.</div>
      <div class="sect">Recent on the left</div><div class="mono muted">D:\\builds\\ecu-4.2</div><div class="mono muted">C:\\cfg\\prod.yaml</div></div>
      <div class="seam"><div><button class="round">⇄</button><button class="primary">Compare</button></div></div>
      <div class="half r"><h3>Right</h3><div class="field"><span class="v mono">${esc(R)}</span><span class="caret"></span><span class="chip">Git ref</span></div><div class="muted">Drop a file or folder on this half.</div>
      <div class="sect">Recent on the right</div><div class="mono muted">D:\\builds\\ecu-4.3</div><div class="mono muted">C:\\cfg\\stage.yaml</div></div></div>` +
      status("Each side keeps its colour in every screen", "<kbd>Ctrl+K</kbd> commands"),
    folders: () => titlebar(TABS) + `<div class="body"><div style="width:250px;flex:none;border-right:1px solid var(--line);padding-top:8px;overflow:hidden">
      <div style="padding:0 10px 6px;display:flex;gap:8px;align-items:center"><span class="mseg"><span>Tree</span><span class="on">Stream</span></span><span class="grow"></span><span class="faint" style="font-size:12px">Viewed 2 of 7</span></div>${dOutline()}</div>
      <div class="col" style="overflow:hidden"><div class="head"><span class="pill edge-l"><span class="mono tagl">navo@v0.6.0</span></span><span class="swap">⇄</span><span class="pill edge-r"><span class="mono tagr">navo@main</span></span><span class="grow"></span>${rules}</div>
      <div class="card"><div class="ch"><span class="bars"><b class="l"></b><b class="r"></b></span><span class="mono">crates/navo-compare/src/text/card.rs</span><span class="grow"></span><span class="tagr mono">+18</span><span class="tagl mono">−4</span><span class="chip">Viewed</span></div>${unified(9)}</div>
      <div class="card"><div class="ch"><span class="bars"><b></b><b class="r"></b></span><span class="mono">crates/navo-compare/src/image.rs</span><span class="grow"></span><span class="tagr">Only right · 8.2 KB</span><span class="chip">Viewed</span></div><div class="ln add"><span class="no">1</span><span class="tx">+ //! Image pair diff: decodes both sides and compares pixels.</span></div></div></div></div>` +
      status("Opens on the Stream; the tree is one click away", "Checking 1 file · 62 %"),
    diff: () => titlebar(TABS) + `<div class="body"><div class="col"><div class="head" style="padding:0;gap:0;flex-wrap:nowrap"><div class="grow edge-l" style="padding:8px 12px"><span class="tagl mono">navo@v0.6.0</span> <span class="muted">card.rs · 12.4 KB</span></div><div class="grow edge-r" style="padding:8px 12px;border-left:1px solid var(--line)"><span class="tagr mono">navo@main</span> <span class="muted">card.rs · 13.1 KB</span></div></div>${sbs("edge-l", "edge-r")}</div></div>` +
      status("Change 2 of 4 · file 1 of 7", "Colours mean the side, not good or bad", "<kbd>Esc</kbd> back"),
  },
};

/** Direction B's rail: open compares and saved ones, or the changed files while a diff is open. */
function railB(on, files) {
  if (files) return `<div class="railb"><div class="ri muted">← navo · v0.6.0 ↔ main</div><div class="sect" style="padding-left:8px">Changed files · 7</div>` +
    ROWS.filter((r) => !r[2] && r[5] !== "same" && r[5] !== "chk").map((r, i) => `<div class="ri${i === 0 ? " on" : ""}"><span class="sq ${r[5] === "diff" ? "c" : r[5]}"></span><span>${r[1].split("/").pop()}</span></div>`).join("") + `</div>`;
  return `<div class="railb"><div class="ri${on < 0 ? " on" : ""}"><span>＋</span><span>New compare</span><span class="grow"></span><kbd>Ctrl+T</kbd></div><div class="sect" style="padding-left:8px">Open</div>
    <div class="ri${on === 0 ? " on" : ""}"><span class="dot"></span><span>navo · v0.6.0 ↔ main</span></div><div class="ri"><span class="dot ok"></span><span>ecu-4.2 ↔ ecu-4.3</span></div>
    <div class="sect" style="padding-left:8px">Recent</div><div class="ri"><span>prod.yaml ↔ stage.yaml</span></div><div class="ri"><span>Clipboard text</span></div>
    <div class="sect" style="padding-left:8px">Named</div><div class="ri"><span>Release check</span></div><div class="ri"><span>ECU nightly</span></div></div>`;
}
/** Direction C's bar: one field that holds both sides or the current file. */
const cbar = (inner) => `<div class="cbar"><span class="faint mono">compare</span>${inner}</div>`;
/** Direction C's single-column tree with L and R presence squares. */
function ctree(sel) {
  return ROWS.map((r, i) => {
    const sq = (side, c) => `<span class="sq ${side ? (r[5] === "diff" ? "c" : r[5] === "same" || r[5] === "chk" ? "s" : c) : ""}"></span>`;
    return `<div class="ctr${i === sel ? " on" : ""}"><span class="n" style="display:flex;gap:6px;align-items:center;padding-left:${r[0] * 14}px;min-width:0"><span class="${r[2] ? "fold" : "file"}"></span><span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r[1]}</span></span>${sq(r[3], "l")}${sq(r[4], "r")}<span class="st ${r[5] === "chk" ? "" : r[5]}" style="font-size:11px">${r[6].replace("Different ", "")}</span></div>`;
  }).join("");
}
/** Direction D's outline: changed files with a left and a right bar. */
function dOutline() {
  return ROWS.filter((r) => !r[2] && r[5] !== "same").map((r, i) => `<div class="ri${i === 0 ? " on" : ""}" style="margin:0 6px"><span class="bars"><b class="${r[3] ? "l" : ""}"></b><b class="${r[4] ? "r" : ""}"></b></span><span>${r[1].split("/").pop()}</span></div>`).join("");
}

const NOTES = {
  a: ["<b>A · Centru.</b> Aspectul actual al Navo. Două câmpuri pe o linie, sesiuni recente și numite dedesubt, taburi sus.", "Arbore aliniat stânga–dreapta cu starea pe mijloc; antet pe o linie cu părțile, regulile și filtrul.", "Cea mai apropiată de ce există azi în Navo."],
  b: ["<b>B · Bară laterală.</b> Aspectul actual al Navo. Sesiunile deschise, recente și numite stau mereu în stânga; fără taburi sus.", "Sub arbore, o fâșie arată prima schimbare a fișierului selectat. În file diff, bara listează fișierele schimbate.", "Regulile se aleg înainte de comparare, pe ecranul de start."],
  c: ["<b>C · O singură bară.</b> Liber. Tot ecranul de start e o bară de comandă cu sugestii: branch-uri, căi recente, text din clipboard.", "Arbore pe o coloană cu pătrate L/R care arată unde există fișierul, iar în dreapta previzualizarea diff-ului.", "Cea mai densă și cea mai orientată pe tastatură; diff unificat implicit."],
  d: ["<b>D · Două părți, două culori.</b> Liber. Stânga și dreapta au fiecare culoarea ei, de la ecranul de start până la diff.", "După comparare se deschide direct Stream-ul (ca un code review); arborele e la un clic.", "Culorile spun de pe ce parte vine linia, nu „șters” sau „adăugat”."],
};
const DIRS = [["a", "A"], ["b", "B"], ["c", "C"], ["d", "D"]];
const SCREENS = [["start", "Start"], ["folders", "Foldere"], ["diff", "File diff"]];
let state = { dir: "a", screen: "start" };

/** Draws the pickers, the window and the notes for the current state. */
function render() {
  const win = document.getElementById("win");
  win.dataset.dir = state.dir;
  win.innerHTML = VIEWS[state.dir][state.screen]();
  const seg = (id, items, key) => {
    document.getElementById(id).innerHTML = items.map(([v, label]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${state[key] === v}">${label}</button>`).join("");
  };
  seg("dirs", DIRS, "dir"); seg("screens", SCREENS, "screen");
  document.getElementById("notes").innerHTML = NOTES[state.dir].map((n) => `<li>${n}</li>`).join("");
}
document.querySelector(".bar").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  state[b.dataset.k] = b.dataset.v;
  location.hash = `${state.dir}-${state.screen}`;
  render();
});
/** Reads "#a-start" style hashes so a view can be linked. */
function fromHash() {
  const m = /^#([abcd])-(start|folders|diff)$/.exec(location.hash);
  if (m) state = { dir: m[1], screen: m[2] };
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
