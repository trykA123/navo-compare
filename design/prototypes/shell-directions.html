<div class="page">
  <h1>Navo Compare: patru direcții pentru aplicația standalone</h1>
  <p class="lede">Alege o direcție și un ecran. Datele sunt aceleași peste tot: compararea <span class="mono">navo@v0.6.0</span> cu <span class="mono">navo@main</span>. Poți combina: de exemplu ecranul de start dintr-o direcție și arborele din alta.</p>
  <div class="bar">
    <div><span class="lab">Direcție</span><span class="seg" id="dirs"></span></div>
    <div><span class="lab">Ecran</span><span class="seg" id="screens"></span></div>
  </div>
  <div class="stage"><div class="win" id="win" data-dir="a"></div></div>
  <ul class="notes" id="notes"></ul>

    mini("Table", "prices.csv", `<div class="cells"><span class="hd">sku</span><span class="hd">price</span><span class="hd">stock</span><span>A-104</span><span class="cc">12.90</span><span>40</span><span>A-221</span><span>8.00</span><span class="cc">0</span><span class="cd">B-007</span><span class="cd">3.10</span><span class="cd">12</span></div>`, "CSV · XLSX, rows matched by key column") +
    mini("Image", "logo.png", `<div class="imgs"><div></div><div class="r"></div><div class="dx"></div></div>`, "2.1 % of pixels differ · 48 KB ↔ 51 KB") +
    mini("Bytes", "firmware.bin", `<span class="x hx"><i>0001F3E0</i>  4E 41 56 4F 00 06 00 00</span><span class="x hx"><i>0001F3E8</i>  <b>00 07</b> 00 00 A4 11 3C 90</span><span class="x add">+ 2 048 bytes inserted</span><span class="x hx"><i>0001FBF0</i>  FF FF FF FF 5A 5A 00 01</span>`, "Aligned by content: the rest stays in step") +
    mini("Embedded", "ecu.hex · ecu.map", x("c", ".text      +1.2 KB") + x("c", "0x80004000  Can_MainFunction  +96 B") + x("add", "+ 0x8000A120  Dcm_ReadDid_F190") + x("", "  by address, not by line"), "Intel HEX · S-Record · linker map · A2L · DBC") +
    mini("Archive", "release.zip", x("", "▾ release.zip") + x("c", "    bin/navo.exe        Different") + x("add", "+   bin/navo-compare.exe") + x("", "    LICENSE             Same"), "Opens as a folder: zip, 7z, tar") +
    mini("Document", "spec.pdf", x("", "  page 3") + x("del", "- Timeout is 30 seconds.") + x("add", "+ Timeout is 45 seconds.") + x("", "  text taken out of the file"), "PDF · DOCX as text; Bytes always works") +
    `</div></div></div>` + status("A file with no known kind opens as Bytes. No pair ever answers “cannot compare”.", "<kbd>Alt+V</kbd> switch the view"),
  select: () => titlebar(TABS) + `<div class="body" style="position:relative"><div class="col"><div class="head">${pills}<span class="crumb">› <b>Folders</b></span><span class="grow"></span>${filter}</div>
    <div class="mark"><span class="tagm">L</span><span class="mono">crates/navo-compare/src/bytes</span><span class="faint">↔</span><span class="tagm">R</span><span class="mono">crates/navo-compare/src/text</span><span class="muted">Two folders marked that do not share a name.</span><span class="grow"></span><button class="btn2">Compare these two folders</button></div>
    ${pickTree([1, 2, 3, 4, 5, 6])}</div>
    <div class="act"><span><b style="font-weight:500">2 selected</b> <span class="muted">· 1 folder with 4 files inside · 1 file</span></span><button class="primary">Compare only these</button><button class="btn2">Stream</button><button class="btn2">Copy to right →</button><button class="btn2">Ignore</button></div></div>` +
    status("<kbd>Space</kbd> tick · <kbd>Shift+↓</kbd> range · a ticked folder takes everything inside it, at any depth", "<kbd>Ctrl+L</kbd> mark left · <kbd>Ctrl+R</kbd> mark right"),
  speed: () => titlebar(tab("builds · ecu-4.2 ↔ ecu-4.3", true)) + `<div class="body"><div class="col"><div class="head"><span class="pill"><span class="k">L</span><span class="mono">D:\\builds\\ecu-4.2</span></span><span class="swap">⇄</span><span class="pill"><span class="k">R</span><span class="mono">D:\\builds\\ecu-4.3</span></span><span class="grow"></span>
    <span class="stages"><span class="stg done">✓ Listed 180 412</span><span class="stg done">✓ Size and time</span><span class="stg run">Content 62 % <span class="prog"><b></b></span></span><button class="btn2">Stop checking</button></span></div>
    <div class="head" style="color:var(--muted);font-size:12px"><span>12 workers</span><span>·</span><span>visible rows first</span><span>·</span><span>171 902 files known from last time, not read again</span><span>·</span><span>1.4 GB/s</span><span class="grow"></span><span>You can open, filter and copy while it runs.</span></div>
    <div class="sect" style="padding:10px 12px 2px">Speed budget · targets the release must meet, measured on every build</div>
    <div class="bud"><span class="hd">Step</span><span class="hd">Target</span><span class="hd">How</span>
    <span>Window on screen</span><span class="t">under 300 ms</span><span>nothing loads before the first frame</span>
    <span>First rows of a folder compare</span><span class="t">under 100 ms</span><span>rows stream in as both sides are listed</span>
    <span>200 000 files by size and time</span><span class="t">under 2 s</span><span>both sides listed in parallel</span>
    <span>The same folders, second time</span><span class="t">under 1 s</span><span>hash cache: only changed files are read</span>
    <span>File diff, up to 1 MB</span><span class="t">under 50 ms</span><span>whole-file diff on a worker</span>
    <span>Two 1 GB logs, first screen</span><span class="t">under 1 s</span><span>top aligned first, the rest fills in</span>
    <span>Two 1 GB binaries, hex view</span><span class="t">under 200 ms</span><span>read by blocks, never all in memory</span>
    <span>Scrolling, any file</span><span class="t">60 frames/s</span><span>rows are built for the screen only</span></div></div></div>` +
    status("These numbers are targets, not measurements.", "A step that runs long shows a simpler result and says so; it never hangs."),
  text: () => titlebar(tab("Two texts", true) + tab("navo · v0.6.0 ↔ main", false)) + `<div class="body"><div class="col"><div class="head"><span class="crumb"><b>Compare two texts</b> <span class="faint">nothing is saved to disk</span></span><span class="grow"></span>${diffRules}</div>
    <div class="diff"><div class="pane"><div class="ph"><span>Left</span><span class="grow"></span><span class="chip">Paste <kbd>Ctrl+1</kbd></span><span class="chip">From file…</span></div>${sideLines("l")}</div>
    <div class="pane"><div class="ph"><span>Right</span><span class="grow"></span><span class="chip">Paste <kbd>Ctrl+2</kbd></span><span class="chip">From file…</span></div>${sideLines("r")}</div>${map}</div></div></div>` +
    status("The diff updates as you type or paste", "4 changes", "<kbd>Ctrl+S</kbd> save a side as a file"),
};

const NOTES = {
  a: ["<b>A · Centru.</b> Aspectul actual al Navo. Două câmpuri pe o linie, sesiuni recente și numite dedesubt, taburi sus.", "Arbore aliniat stânga–dreapta cu starea pe mijloc; antet pe o linie cu părțile, regulile și filtrul.", "Cea mai apropiată de ce există azi în Navo."],
  b: ["<b>B · Bară laterală.</b> Aspectul actual al Navo. Sesiunile deschise, recente și numite stau mereu în stânga; fără taburi sus.", "Sub arbore, o fâșie arată prima schimbare a fișierului selectat. În file diff, bara listează fișierele schimbate.", "Regulile se aleg înainte de comparare, pe ecranul de start."],
  c: ["<b>C · O singură bară.</b> Liber. Tot ecranul de start e o bară de comandă cu sugestii: branch-uri, căi recente, text din clipboard.", "Arbore pe o coloană cu pătrate L/R care arată unde există fișierul, iar în dreapta previzualizarea diff-ului.", "Cea mai densă și cea mai orientată pe tastatură; diff unificat implicit."],
  d: ["<b>D · Două părți, două culori.</b> Liber. Stânga și dreapta au fiecare culoarea ei, de la ecranul de start până la diff.", "După comparare se deschide direct Stream-ul (ca un code review); arborele e la un clic.", "Culorile spun de pe ce parte vine linia, nu „șters” sau „adăugat”."],
};
const DIRS = [["a", "A"], ["b", "B"], ["c", "C"], ["d", "D"]];
const SCREENS = [["start", "Start"], ["folders", "Foldere"], ["diff", "File diff"], ["select", "Selecție"], ["types", "Orice fișier"], ["speed", "Viteză"], ["text", "Două texte"]];
const SHARED_NOTES = {
  select: ["<b>Selecție.</b> Bifezi foldere și fișiere; un folder bifat ia tot ce are înăuntru, la orice adâncime. „Compare only these” restrânge compararea la ele.", "Poți marca două foldere cu nume diferite (unul pe stânga, unul pe dreapta) și le compari direct între ele, cu tot conținutul.", "Ecran comun: arată la fel în toate direcțiile, doar culorile se schimbă."],
  types: ["<b>Orice fișier.</b> Fiecare tip primește vederea potrivită: text, structurat, tabel, imagine, octeți, fișiere embedded, arhive, documente.", "Un tip necunoscut se deschide ca octeți. Nicio pereche nu răspunde „nu se poate compara”.", "Există azi: text, octeți, imagine. Restul sunt propuneri pentru etapele Compare 2–3."],
  speed: ["<b>Viteză.</b> Compararea nu blochează niciodată: rândurile apar pe măsură ce sunt listate, verificarea de conținut rulează în fundal, rândurile vizibile întâi.", "A doua comparare a acelorași foldere citește doar fișierele schimbate (cache de hash).", "Cifrele din tabel sunt ținte din plan, nu măsurători. Fiecare build le măsoară."],
  text: ["<b>Două texte.</b> Lipești două texte și vezi diferențele pe loc, fără fișiere.", "Diff-ul se actualizează în timp ce scrii.", "Ecran comun pentru toate direcțiile."],
};
let state = { dir: "a", screen: "start" };

/** Draws the pickers, the window and the notes for the current state. */
function render() {
  const win = document.getElementById("win");
  win.dataset.dir = state.dir;
  win.innerHTML = (VIEWS[state.dir][state.screen] || SHARED[state.screen])();
  const seg = (id, items, key) => {
    document.getElementById(id).innerHTML = items.map(([v, label]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${state[key] === v}">${label}</button>`).join("");
  };
  seg("dirs", DIRS, "dir"); seg("screens", SCREENS, "screen");
  document.getElementById("notes").innerHTML = (SHARED_NOTES[state.screen] || NOTES[state.dir]).map((n) => `<li>${n}</li>`).join("");
}
document.querySelector(".bar").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  state[b.dataset.k] = b.dataset.v;
  location.hash = `${state.dir}-${state.screen}`;
  render();
});
/** Reads "#a-start" style hashes so a view can be linked. */
function fromHash() {
  const m = /^#([abcd])-(start|folders|diff|select|types|speed|text)$/.exec(location.hash);
  if (m) state = { dir: m[1], screen: m[2] };
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
