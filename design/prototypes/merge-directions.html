<div class="page">
  <h1>Sidewise: patru direcții pentru ecranul de merge</h1>
  <p class="lede">Alege o direcție și un ecran. Aceeași bucată de cod Rust peste tot: <span class="mono">text/card.rs</span>, branch-urile <span class="mono">main</span> și <span class="mono">feature/limits</span>. Taste: <span class="mono">A–D</span> schimbă direcția, <span class="mono">1–4</span> schimbă ecranul.</p>
  <div class="bar">
    <div><span class="lab">Direcție</span><span class="seg" id="dirs"></span></div>
    <div><span class="lab">Ecran</span><span class="seg" id="screens"></span></div>
  </div>
  <div class="stage"><div class="win" id="win" data-dir="a"></div></div>
  <ul class="notes" id="notes"></ul>

<script>
// Renders four merge-screen directions for Sidewise from one sample file; no state is stored.
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/** Escapes text and wraps [[marked]] words in a highlight span. */
const hl = (s, cls = "wa") => esc(s).replace(/\[\[(.*?)\]\]/g, (_, x) => `<span class="${cls}">${x}</span>`);

/** Turns the two-way sample into display rows, applying the changes already taken. */
function twRows(T) {

    const t = T[r.c];
    let l, q;
    if (r.k === "eq") { l = { no: r.l, h: esc(r.lt), c: "" }; q = { no: r.r, h: esc(r.lt), c: "" }; }
    else if (t === "left") { if (r.k === "add") continue; l = { no: r.l, h: raw(r.lt), c: "" }; q = { no: r.r, h: raw(r.lt), c: "" }; }
    else if (t === "right") { q = { no: r.r, h: raw(r.rt), c: "" }; l = { no: r.l ?? r.r, h: raw(r.rt), c: "" }; }
    else if (r.k === "chg") { l = { no: r.l, h: hl(r.lt, "wd"), c: "del" }; q = { no: r.r, h: hl(r.rt, "wa"), c: "add" }; }
    else { l = { no: "", h: "", c: "fill" }; q = { no: r.r, h: esc(r.rt), c: "add" }; }
    const first = !!r.c && !seen[r.c]; if (r.c) seen[r.c] = 1;
    out.push({ c: r.c, t, first, l, r: q, lt: r.lt, rt: r.rt, k: r.k });
  }
  return out;
}

    <div class="opts">${optC(c, "m", ed, "1", "Use mine")}${optC(c, "t", ed, "2", "Use theirs")}</div>
    <div style="display:flex;gap:8px;align-items:center;padding:10px 0"><button class="ab"${ed ? " disabled" : ""}>${kb("3")}Use both</button><button class="ab${ed ? " pri" : ""}">${kb("4")}Edit</button><span class="sp"></span>${ed ? actEdit : `<span class="muted">${kb("F8")} next conflict</span>`}</div>
    <div class="prev"><div class="sec" style="border-top:0;border-radius:8px 8px 0 0">${ed ? bd("edit", "Editing") : bd("open", "Open")}<b>Result at this spot</b><span class="muted">the only editable text</span></div><div style="padding:6px 0">${res}</div></div>${auto}</div></div></div>` + stat3(S);
}
/** Preview lines for a spot in direction C: a hint when open, the chosen text when decided. */
function s3(c, s) {
  if (s === "open") return mlc("", `<i class="muted" style="font-family:var(--font-ui)">Choose an option above. The line appears here.</i>`);
  return outLines(c, s).map((t, j) => mlc(c.line + j, raw(t))).join("");
}

// ---------- Direction D: result first, ghost choices, one decision bar ----------
function blockD(S, i) {
  const c = CONF[i], s = S.c[i], foc = S.focus === i;
  if (s === "open") return `<div class="blk${foc ? " focus" : ""}"><div class="bh">${bd("open", "Open")}<b style="font-weight:500;color:var(--text)">Conflict ${i + 1}</b>line ${c.line} · pick one of the two</div>` +
    c.mine.map((t, j) => ml3(c.line + j, hl(t), "ghost", "m", j === 0 ? `<span class="muted">${MAIN}</span>` : "")).join("") + c.theirs.map((t, j) => ml3(c.line + j, hl(t), "ghost", "t", j === 0 ? `<span class="muted">${FEAT}</span>` : "")).join("") + `</div>`;
  if (s === "edit") return `<div class="blk focus"><div class="bh">${bd("edit", "Editing")}<b style="font-weight:500;color:var(--text)">Conflict ${i + 1}</b>line ${c.line}</div>${c.hand.map((t, j) => ml3(c.line + j, esc(t) + (j === 1 ? caret : ""), "res", "h")).join("")}</div>`;
  return outLines(c, s).map((t, j) => ml3(c.line + j, raw(t), "res", markOf(s) === "mt" ? "mt" : markOf(s), j === 0 ? `${bd("done", WHO[s])}<button class="lnk">Undo</button>` : "")).join("");
}
const legendD = (two) => `<div class="legend"><span>${sd("m")}${two ? "left" : MAIN}</span><span>${sd("t")}${two ? "right" : FEAT}</span>${two ? "" : `<span>${sd("h")}by hand</span>`}<span class="faint">The margin shows which side each line came from</span></div>`;
const docD = (S) => legendD() + items(S).map((it) => it.t === "fold" ? foldRow(it, ml3) : it.t === "auto" ? autoRow(it.a, ml3) : it.t === "line" ? ml3(it.no, esc(it.text)) : blockD(S, it.i)).join("");
function dockD(S) {
  const i = S.focus;
  if (i < 0) return `<div class="dock">${bd("done", "Ready to save")}<span class="muted">12 changes merged</span><span class="trk" style="flex:1;min-width:160px;height:12px"><b class="a m" style="width:${5 / 12 * 100}%"></b><b class="m" style="width:${1 / 12 * 100}%"></b><b class="a t" style="width:${4 / 12 * 100}%"></b><b class="t" style="width:${1 / 12 * 100}%"></b><b class="h" style="width:${1 / 12 * 100}%"></b></span><span class="bd">${sd("m")}${MAIN} 6</span><span class="bd">${sd("t")}${FEAT} 5</span><span class="bd">${sd("h")}by hand 1</span></div>`;
  const ed = S.c[i] === "edit";
  return `<div class="dock">${bd(ed ? "edit" : "open", `Conflict ${i + 1} of 3`)}<span class="muted">line ${CONF[i].line}</span><span class="sp"></span>${ed ? actEdit : act4(true)}<span class="muted">${kb("F8")} next</span></div>`;
}
function D3(k) {
  const S = ST[k];
  return titlebar(tabs("card.rs · merge", S.focus < 0 ? "ok" : "")) + `<div class="body"><div class="col">${head3(S, false)}<div class="doc">${docD(S)}</div>${dockD(S)}</div></div>` + stat3(S);
}
function A3(k) {
  const S = ST[k], done = S.focus < 0;
  return titlebar(tabs("card.rs · merge", done ? "ok" : "")) + `<div class="body"><div class="col">${head3(S)}<div class="doc">${done ? doneBox() : ""}${docA(S)}</div></div>${mapA(S)}</div>` + stat3(S);
}

// ---------- Two-way views ----------
const twFold = (n) => `<div class="ml fl" style="grid-template-columns:40px 22px 1fr"><span></span><span></span><span class="tx">▸ ${n} unchanged lines</span></div>`;
/** Direction A, two-way: two panes with a gutter; the change carries its two buttons in the gutter. */
function A2() {
  const rows = twRows(TWS).map((r) => r.fold ? `<div class="tw"><div>${twFold(r.fold)}</div><div class="gut"></div><div>${twFold(r.fold)}</div></div>` :
    `<div class="tw">${mlc(r.l.no, r.l.h, r.l.c)}<div class="gut">${r.first ? (r.t ? twTaken(r.t) : twBtns()) : ""}</div>${mlc(r.r.no, r.r.h, r.r.c)}</div>`).join("");
  return titlebar(tabs("card.rs · compare", "")) + `<div class="body"><div class="col">${head2(TWS)}<div class="tw" style="border-bottom:1px solid var(--line);color:var(--muted);font-size:12px"><div class="pane2h" style="border:0">navo@v0.6.0 · left</div><div class="gut"></div><div class="pane2h" style="border:0">navo@main · right</div></div><div class="doc">${rows}</div></div>${twMap()}</div>` + stat2("Used left on change 1");
}
/** Direction B, two-way: changes list on the left, a hunk header with the buttons above each change. */
function B2() {
  const rail = `<div class="rail3"><div class="sect" style="padding:2px 8px">Changes</div>` + [1, 2, 3].map((c) => `<div class="it${c === 2 ? " on" : ""}"><div class="t1">${TWS[c] ? bd("done", `From ${TWS[c]}`) : bd("open", "Open")}<span class="sp"></span><span class="mono faint">${CH[c].replace("lines ", "").replace("line ", "")}</span></div><div class="t2">Change ${c} · ${CH[c]}</div></div>`).join("") + `<div class="sect" style="padding:12px 8px 2px">Unchanged</div><div class="ar">▸ 38 lines folded</div></div>`;
  let cells = `<div class="pane2h">navo@v0.6.0 · left</div><div class="pane2h" style="border-left:1px solid var(--line)">navo@main · right</div>`;
  twRows(TWS).forEach((r) => {
    if (r.fold) { cells += `<div class="ml fl" style="grid-column:1/-1;grid-template-columns:40px 22px 1fr"><span></span><span></span><span class="tx">▸ ${r.fold} unchanged lines</span></div>`; return; }
    if (r.first) cells += `<div class="hh">${r.t ? bd("done", `Change ${r.c} taken from ${r.t}`) : bd("open", `Change ${r.c}`)}<span class="muted">${CH[r.c]}</span><span class="sp"></span>${r.t ? "" : twBtns()}</div>`;
    cells += mlc(r.l.no, r.l.h, r.l.c) + mlc(r.r.no, r.r.h, r.r.c);
  });
  return titlebar(tabs("card.rs · compare", "")) + `<div class="body">${rail}<div class="col">${head2(TWS)}<div class="doc"><div class="tw2">${cells}</div></div></div></div>` + stat2("Used left on change 1");
}
/** Direction C, two-way: one change as two big options, then a table of all changes. */
function C2() {
  const rows = [1, 2, 3].map((c) => {
    const r = TW.find((x) => x.c === c);
    return `<span class="${c === 2 ? "on" : ""}">Change ${c}</span><span class="mono ${c === 2 ? "on" : ""}">${r.l ?? r.r}</span><span class="mono ${c === 2 ? "on" : ""}">${raw(r.lt || "").trim()}</span><span class="mono ${c === 2 ? "on" : ""}">${raw(r.rt || "").trim()}</span><span class="${c === 2 ? "on" : ""}">${TWS[c] ? bd("done", `Taken from ${TWS[c]}`) : bd(c === 2 ? "edit" : "open", c === 2 ? "Open · now here" : "Open")}</span>`;
  }).join("");
  const l2 = TW.filter((r) => r.c === 2);
  const opt = (side, lines, key, label) => `<div class="opt"><div class="oh">${sd(side)}<b>${side === "m" ? "navo@v0.6.0" : "navo@main"}</b><span class="muted">${side === "m" ? "left" : "right"}</span></div><div class="ob">${lines}</div><div class="of"><button class="ab pri">${kb(key)}${label}</button></div></div>`;
  return titlebar(tabs("card.rs · compare", "")) + `<div class="body"><div class="col">${head2(TWS)}<div class="doc" style="padding:12px"><div class="steps">${[1, 2, 3].map((c) => `<div class="stp${c === 2 ? " on" : ""}"><span>${TWS[c] ? bd("done", `From ${TWS[c]}`) : bd("open", "Open")}</span><span class="t2">Change ${c} · ${CH[c]}</span></div>`).join("")}</div>
    <div style="display:flex;gap:10px;align-items:center;padding:14px 2px 8px"><b style="font-size:15px;font-weight:600">Change 2 of 3</b><span class="muted">${CH[2]}</span><span class="sp"></span><span class="muted">${kb("F8")} next change</span></div>
    <div class="opts">${opt("m", mlc(45, hl(l2[0].lt, "wd"), "del"), "1", "Use left")}${opt("t", l2.map((r, j) => mlc(45 + j, j ? esc(r.rt) : hl(r.rt, "wa"), "add")).join(""), "2", "Use right")}</div>
    <div class="box3" style="margin:12px 0 0"><div class="sect">All changes in this file</div><div class="tbl"><span class="h">Change</span><span class="h">Line</span><span class="h">Left</span><span class="h">Right</span><span class="h">Status</span>${rows}</div></div></div></div></div>` + stat2("Used left on change 1");
}
/** Direction D, two-way: one unified column with the buttons at the end of each change. */
function D2() {
  const L = (r) => ml3(r.l.no, r.l.h, r.l.c, "m"), R = (r) => ml3(r.r.no, r.r.h, r.r.c, "t");
  const rows = twRows(TWS).map((r) => {
    if (r.fold) return ml3("", `▸ ${r.fold} unchanged lines`, "fl");
    if (r.k === "eq") return ml3(r.l.no, r.l.h);
    if (r.t) return ml3(r.l.no, r.l.h, "res", r.t === "left" ? "m" : "t", r.first ? `${twTaken(r.t)}` : "");
    const btn = r.first ? twBtns() : "";
    if (r.k === "chg") return ml3(r.l.no, r.l.h, "del", "m", btn) + ml3(r.r.no, r.r.h, "add", "t");
    return ml3(r.r.no, r.r.h, "add", "t");
  }).join("");
  return titlebar(tabs("card.rs · compare", "")) + `<div class="body"><div class="col">${head2(TWS)}<div class="doc">${legendD(true)}${rows}</div></div></div>` + stat2("Used left on change 1");
}

// ---------- Glue ----------
const VIEWS = {
  a: { two: A2, start: () => A3("start"), work: () => A3("work"), done: () => A3("done") },
  b: { two: B2, start: () => B3("start"), work: () => B3("work"), done: () => B3("done") },
  c: { two: C2, start: () => C3("start"), work: () => C3("work"), done: () => C3("done") },
  d: { two: D2, start: () => D3("start"), work: () => D3("work"), done: () => D3("done") },
};
const NOTES = {
  a: ["<b>A · Rezultatul cu carduri în el.</b> Aspectul actual al Navo. Un singur text, rezultatul; fiecare conflict e un card chiar la locul lui, cu cele patru acțiuni în antet.", "Schimbările automate stau pliate în rânduri „N lines · M automatic”; apeși Show și apar pe loc, fiecare cu forma și numele părții. Harta din dreapta arată unde mai sunt conflicte.", "În două direcții (fără merge), butoanele „Use left / Use right” stau în canalul dintre panouri, la schimbarea însăși. Cea mai apropiată de Stream-ul din Navo."],
  b: ["<b>B · Listă de lucru și un conflict în față.</b> Aspectul actual al Navo. Bara din stânga e lista „To do”: răspunde direct la „ce mai am de făcut”.", "Conflictul curent apare pe trei coloane (Base, main, feature/limits); sub el e Result, singurul panou editabil. Schimbările automate sunt o listă în bară, nu în text.", "Cea mai explicită și cea mai ușor de învățat; plătește cu spațiu (trei zone pe ecran). În două direcții, fiecare schimbare are antet cu butoanele ei."],
  c: ["<b>C · Un conflict pe rând.</b> Liber: schimb structura, nu tokenii. Pașii de sus sunt harta; ecranul arată un singur conflict, ca un asistent.", "Două opțiuni mari lângă olaltă, textul de dinainte deasupra, iar Result e doar un loc mic, editabil. Schimbările automate sunt un pas separat, la cerere.", "Cea mai liniștită pentru cine n-a făcut niciodată merge; mai lentă la 50 de conflicte (de aceea F8 și tastele 1–4). La final, un tabel „ce ai decis”."],
  d: ["<b>D · Rezultatul întâi, o bară de decizii.</b> Liber: tot documentul e rezultatul; conflictele deschise arată ambele variante ca text-fantomă, iar o singură bară jos acționează pe cel curent.", "Marginea are trei benzi (cerc = main, romb = feature/limits, pătrat = manual) și arată de unde vine fiecare linie, deci și schimbările automate dezvăluite.", "La final bara devine rezumatul: o bară cu cât s-a luat de la fiecare parte. Cea mai compactă; butoanele nu stau pe conflict, ci în bară."],
};
const DIRS = [["a", "A"], ["b", "B"], ["c", "C"], ["d", "D"]];
const SCREENS = [["two", "Two-way"], ["start", "Three-way, start"], ["work", "Three-way, working"], ["done", "Three-way, done"]];
let state = { dir: "a", screen: "start" };

/** Draws the pickers, the window and the notes for the current state. */
function render() {
  const win = document.getElementById("win");
  win.dataset.dir = state.dir;
  win.innerHTML = VIEWS[state.dir][state.screen]();
  const seg = (id, items, key) => {
    document.getElementById(id).innerHTML = items.map(([v, label]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${state[key] === v}">${label}</button>`).join("");
  };
  seg("dirs", DIRS, "dir"); seg("screens", SCREENS, "screen");
  document.getElementById("notes").innerHTML = NOTES[state.dir].map((n) => `<li>${n}</li>`).join("");
}
document.querySelector(".bar").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  state[b.dataset.k] = b.dataset.v;
  location.hash = `${state.dir}-${state.screen}`;
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const d = "abcd".indexOf(e.key.toLowerCase()), s = "1234".indexOf(e.key);
  if (d >= 0 && e.key.length === 1) state.dir = "abcd"[d];
  else if (s >= 0) state.screen = SCREENS[s][0];
  else return;
  location.hash = `${state.dir}-${state.screen}`;
  render();
});
/** Reads "#a-start" style hashes so a view can be linked. */
function fromHash() {
  const m = /^#([abcd])-(two|start|work|done)$/.exec(location.hash);
  if (m) state = { dir: m[1], screen: m[2] };
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
