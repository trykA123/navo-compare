<title>Sidewise icon directions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Picker for four Sidewise app-icon directions; colours are the shell tokens, tiles pin their own light/dark. */
:root{--h:225;--ha:218;--rail:oklch(95.5% .012 var(--h));--bg:oklch(98.5% .008 var(--h));--surface:oklch(99.8% .003 var(--h));--line:oklch(89% .014 var(--h));--text:oklch(22% .014 var(--h));--muted:oklch(48.8% .017 var(--h));--hover:oklch(94.25% .027 var(--ha));--sel:oklch(90% .046 var(--ha));--accent:oklch(52% .1 var(--ha));--on-accent:oklch(99% .005 var(--ha));--font-ui:"Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--rail:oklch(19% .014 var(--h));--bg:oklch(22.5% .014 var(--h));--surface:oklch(26.5% .014 var(--h));--line:oklch(33% .014 var(--h));--text:oklch(93.8% .014 var(--h));--muted:oklch(72% .017 var(--h));--hover:oklch(27.75% .036 var(--ha));--sel:oklch(33% .058 var(--ha));--accent:oklch(76% .11 var(--ha));--on-accent:oklch(18% .03 var(--ha))}}
:root[data-theme=dark]{color-scheme:dark;--rail:oklch(19% .014 var(--h));--bg:oklch(22.5% .014 var(--h));--surface:oklch(26.5% .014 var(--h));--line:oklch(33% .014 var(--h));--text:oklch(93.8% .014 var(--h));--muted:oklch(72% .017 var(--h));--hover:oklch(27.75% .036 var(--ha));--sel:oklch(33% .058 var(--ha));--accent:oklch(76% .11 var(--ha));--on-accent:oklch(18% .03 var(--ha))}
*{box-sizing:border-box}
body{margin:0;background:var(--rail);color:var(--text);font:14px/1.45 var(--font-ui);padding:16px;overflow-x:hidden}
.page{max-width:1100px;margin:auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar button{font:inherit;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 16px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--sel);color:var(--text);border-color:var(--accent)}
.bar span{color:var(--muted);margin-left:auto;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{border-radius:14px;border:1px solid var(--line);padding:16px;display:grid;gap:14px;justify-items:start}
.big{width:min(256px,100%)}.big svg{width:100%;height:auto;display:block}
.sizes{display:flex;gap:14px;align-items:end;flex-wrap:wrap}
.lt{background:oklch(98.5% .008 225);color:oklch(22% .014 225)}
.dk{background:oklch(22.5% .014 225);color:oklch(93.8% .014 225)}
.ac{background:oklch(52% .1 218);color:oklch(99% .005 218)}
.cap{font-size:12px;opacity:.7}
.mocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.task{display:flex;align-items:center;gap:6px;height:44px;border-radius:8px;padding:0 10px;font-size:12px}
.task i{width:24px;height:24px;border-radius:4px;background:currentColor;opacity:.18}
.task .app{display:grid;place-items:center;width:40px;height:36px;border-radius:6px;background:rgb(128 128 128/.22);border-bottom:2px solid oklch(65% .1 218)}
.titlebar{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px 8px 0 0;font-size:12px}
.titlebar b{margin-left:auto;letter-spacing:.3em;font-weight:400;opacity:.6}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px 6px 34px}
.notes li{margin:10px 0;max-width:80ch}
h1{font-size:15px;margin:0;font-weight:600}
@media(max-width:800px){.tiles,.mocks{grid-template-columns:minmax(0,1fr)}}
</style>
<div class="page">
 <div class="bar" role="group" aria-label="Direction"><h1>Sidewise icon</h1>
  <button data-d="a">A</button><button data-d="b">B</button><button data-d="c">C</button><button data-d="d">D</button><span>tastele 1-4</span></div>
 <div class="tiles" id="tiles"></div>
 <div class="mocks">
  <div class="card"><span class="cap">Bara de activități, 16 px (închisă, apoi deschisă)</span><div class="task dk"><div class="app" data-i="16"></div><i></i><i></i></div><div class="task lt"><div class="app" data-i="16"></div><i></i><i></i></div></div>
  <div class="card"><span class="cap">Bara de titlu, 16 px</span><div class="titlebar lt"><span data-i="16"></span>Sidewise<b>– ☐ ✕</b></div><div class="titlebar dk"><span data-i="16"></span>Sidewise<b>– ☐ ✕</b></div></div>
 </div>
 <ol class="notes" id="notes"></ol>
</div>
<template id="s-a"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><rect width="256" height="256" rx="56.32" fill="#081115"/><rect x="48" y="52" width="68" height="140" fill="#E2EDF2"/><rect x="140" y="76" width="68" height="140" fill="#50C2DF"/></svg>
</template><template id="t-a"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><rect width="16" height="16" rx="3.5" fill="#081115"/><rect x="3" y="3" width="4" height="9" fill="#E2EDF2"/><rect x="9" y="5" width="4" height="9" fill="#50C2DF"/></svg>
</template>
<template id="s-b"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><rect width="256" height="256" rx="56.32" fill="#081115"/><rect x="40" y="52" width="72" height="32" fill="#E2EDF2"/><rect x="40" y="112" width="48" height="32" fill="#50C2DF"/><rect x="40" y="172" width="56" height="32" fill="#E2EDF2"/><rect x="144" y="52" width="72" height="32" fill="#E2EDF2"/><rect x="144" y="112" width="72" height="32" fill="#50C2DF"/><rect x="144" y="172" width="56" height="32" fill="#E2EDF2"/></svg>
</template><template id="t-b"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><rect width="16" height="16" rx="3.5" fill="#081115"/><rect x="2" y="3" width="5" height="2" fill="#E2EDF2"/><rect x="2" y="7" width="3" height="2" fill="#50C2DF"/><rect x="2" y="11" width="4" height="2" fill="#E2EDF2"/><rect x="9" y="3" width="5" height="2" fill="#E2EDF2"/><rect x="9" y="7" width="5" height="2" fill="#50C2DF"/><rect x="9" y="11" width="4" height="2" fill="#E2EDF2"/></svg>
</template>
<template id="s-c"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><path transform="translate(0 -12)" d="M120 36.35A92 92 0 0 0 120 219.65Z" fill="#1FA588"/><path transform="translate(0 12)" d="M136 36.35A92 92 0 0 1 136 219.65Z" fill="#F5A524"/></svg>
</template><template id="t-c"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><path d="M7 1.5A6.5 6.5 0 0 0 7 14.5Z" transform="translate(0 -1)" fill="#1FA588"/><path d="M9 1.5A6.5 6.5 0 0 1 9 14.5Z" transform="translate(0 1)" fill="#F5A524"/></svg>
</template>
<template id="s-d"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><rect width="256" height="256" rx="56.32" fill="#16141C"/><path d="M56 52H200V88H92V110H152V146H56Z" fill="#F4F1EA"/><path d="M164 110H200V204H56V168H164Z" fill="#F0563B"/></svg>
</template><template id="t-d"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><rect width="16" height="16" rx="3.5" fill="#16141C"/><path d="M3 3H13V5H5V7H10V9H3Z" fill="#F4F1EA"/><path d="M11 7H13V13H3V11H11Z" fill="#F0563B"/></svg>
</template>
<script>
(function(){
var N={"a":["Două panouri verticale, unul lângă altul; cel din dreapta e cyan și coborât puțin. Decalajul spune „aceleași lucruri, dar nu la fel”.","Aceeași limbă ca Navo: fundal închis, alb rece, bară cyan cu colțuri drepte. Se vede imediat că e din familie.","Compromis: cel mai simplu și cel mai curat la 16 px, dar și cel mai generic ca idee."],"b":["Două coloane de linii, ca un diff: rândurile se potrivesc, iar una singură diferă (cyan, lungimi diferite).","Aceeași familie ca Navo (tile închis, bare drepte, cyan). Spune „comparare de text” mai direct decât A.","Compromis: la 16 px sunt doar trei rânduri pe parte; merge, dar e mai aglomerat și seamănă cu o iconiță de listă."],"c":["Un disc tăiat vertical în două jumătăți, una ridicată, alta coborâtă: două lucruri care aproape se potrivesc.","Fără tile, două culori calde/reci proprii (verde-turcoaz și chihlimbar). Se desparte clar de Navo.","Compromis: cea mai ușor de recunoscut în bară, dar nu are familia Navo și pe suprafețe cu accent contrastul verde e mai slab."],"d":["O literă S construită din două piese care se îmbină: stânga și dreapta, comparate și unite. Monogramă deliberată.","Tile aproape negru, alb cald și roșu-portocaliu. Altă paletă decât Navo, dar aceeași formă de tile.","Compromis: o literă e memorabilă, dar spune „Sidewise” mai mult decât „comparare”; la 16 px golurile sunt de un pixel."]},sizes=[256,64,48,32,24,16],root=document.documentElement;
function svg(id,px){var s=document.getElementById(id).content.firstElementChild.cloneNode(true);s.setAttribute('width',px);s.setAttribute('height',px);s.style.display='block';s.setAttribute('aria-hidden','true');return s}
function show(d){
 if('abcd'.indexOf(d)<0)d='a';
 document.querySelectorAll('.bar button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.d===d)});
 var t=document.getElementById('tiles');t.textContent='';
 [['lt','Fundal deschis'],['dk','Fundal închis'],['ac','Culoare de accent']].forEach(function(x){
  var c=document.createElement('div');c.className='tile '+x[0];
  var b=document.createElement('div');b.className='big';b.appendChild(svg('s-'+d,256));c.appendChild(b);
  var r=document.createElement('div');r.className='sizes';
  sizes.slice(1).forEach(function(p){r.appendChild(svg(p===16?'t-'+d:'s-'+d,p))});
  c.appendChild(r);var cap=document.createElement('div');cap.className='cap';cap.textContent=x[1]+' · 64 / 48 / 32 / 24 / 16 px';c.appendChild(cap);t.appendChild(c)});
 document.querySelectorAll('[data-i]').forEach(function(e){e.textContent='';e.appendChild(svg('t-'+d,16))});
 var n=document.getElementById('notes');n.textContent='';N[d].forEach(function(s){var li=document.createElement('li');li.textContent=s;n.appendChild(li)});
 if(location.hash!=='#'+d)history.replaceState(null,'','#'+d);
}
document.querySelectorAll('.bar button').forEach(function(b){b.onclick=function(){show(b.dataset.d)}});
addEventListener('keydown',function(e){var i='1234'.indexOf(e.key);if(i>=0&&!e.ctrlKey&&!e.metaKey&&!e.altKey)show('abcd'[i])});
addEventListener('hashchange',function(){show(location.hash.slice(1))});
show(location.hash.slice(1)||'a');
})();
</script>
